name: Recover stalled Pages deployment

on:
  push:
    paths:
      - '.github/workflows/recover-pages.yml'
  workflow_dispatch:

permissions:
  pages: write

jobs:
  cancel-stalled-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the stale Pages deployment blocking publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST --include "repos/$GITHUB_REPOSITORY/pages/deployments/d796d22d3bc80ac730aaede956c75de0cb62172b/cancel"
